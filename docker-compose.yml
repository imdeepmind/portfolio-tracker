version: '3.9'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: portfolio-app
    restart: unless-stopped
    ports:
      - '3000:3000'
    env_file: .env
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - mongo

  mongo:
    image: mongo:7
    container_name: portfolio-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    env_file: .env.local
    volumes:
      - mongo-data:/data/db

volumes:
  mongo-data:
